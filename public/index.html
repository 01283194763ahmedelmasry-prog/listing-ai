<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>محسّن قوائم المنتجات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui,sans-serif;background:#f8fafc;margin:0;color:#0f172a}main{max-width:640px;margin:auto;padding:24px}
h1 span{color:#0d9488}input,textarea,button,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #cbd5e1;font:inherit;box-sizing:border-box}
button{background:linear-gradient(90deg,#14b8a6,#0e7490);color:#fff;border:0;cursor:pointer}pre{white-space:pre-wrap;background:#fff;padding:12px;border-radius:10px}
.plans{display:flex;gap:8px}.plans div{flex:1;background:#fff;border-radius:10px;padding:12px;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar button{width:auto}#lang_btn{margin:0}.badge{background:#ccfbf1;border-radius:20px;padding:6px 12px}
.hide{display:none}.g{background:#fff;color:#0f172a;border:1px solid #cbd5e1}.f{background:#1877f2}</style></head><body><main>
<div class="bar"><b data-i="brand">محسّن القوائم</b><button id="lang_btn" class="g" onclick="setLang(LANG==='ar'?'en':'ar')">English</button><span id="status" class="badge hide"></span><button id="out_btn" class="hide g" onclick="sb.auth.signOut()" data-i="logout">خروج</button></div>
<h1 data-i="h1">حوّل منتجاتك إلى <span>قوائم احترافية</span></h1>

<section id="login" class="hide"><p data-i="loginp">سجّل دخول عشان تبدأ (3 محاولات مجانية للمستخدم الجديد)</p>
<button class="g" onclick="login('google')" data-i="google">الدخول بحساب Google</button><!-- Facebook: enable after Meta review --><button class="f hide" onclick="login('facebook')">الدخول بحساب Facebook</button></section>

<section id="app" class="hide">
<input id="name" data-p="name" placeholder="اسم المنتج"><textarea id="details" rows="4" data-p="details" placeholder="تفاصيل المنتج"></textarea>
<input id="img" type="file" accept="image/*"><button id="go" data-i="go">ولّد القائمة</button><pre id="out"></pre>
<h2 data-i="sub">الاشتراك</h2>
<div class="plans"><div><b data-i="monthly">شهري</b><br>$25<button onclick="pick('monthly')" data-i="subscribe">اشترك</button></div><div><b data-i="yearly">سنوي</b><br>$228<button onclick="pick('yearly')" data-i="subscribe">اشترك</button></div></div>
<div id="pay" class="hide"><h3 data-i="paymethod">اختر طريقة الدفع</h3>
<select id="method" onchange="show()"><option value="paypal">PayPal</option><option value="binance">Binance Pay</option><option value="orange">Orange Cash</option></select>
<pre id="inst"></pre><a id="wa" target="_blank"><button data-i="sendreceipt">ابعت إيصال الدفع على واتساب</button></a></div>
</section>
<a id="wafab" target="_blank" style="position:fixed;bottom:16px;left:16px;background:#25d366;color:#fff;padding:12px 18px;border-radius:30px;text-decoration:none"data-i="support">واتساب 💬 الدعم</a>
<p style="text-align:center;font-size:13px"><a href="/privacy.html" data-i="privacy">سياسة الخصوصية</a> · <a href="/terms.html" data-i="terms">الشروط</a></p>
<script>
const $=id=>document.getElementById(id);let sb,C={},ME=null,PLAN='';
const D={ar:{brand:'محسّن القوائم',logout:'خروج',h1:'حوّل منتجاتك إلى <span>قوائم احترافية</span>',loginp:'سجّل دخول عشان تبدأ (3 محاولات مجانية للمستخدم الجديد)',google:'الدخول بحساب Google',name:'اسم المنتج',details:'تفاصيل المنتج',go:'ولّد القائمة',sub:'الاشتراك',monthly:'شهري',yearly:'سنوي',subscribe:'اشترك',paymethod:'اختر طريقة الدفع',sendreceipt:'ابعت إيصال الدفع على واتساب',support:'واتساب 💬 الدعم',privacy:'سياسة الخصوصية',terms:'الشروط',active:(p,d)=>`اشتراكك ${p}: باقي ${d} يوم`,left:n=>`متبقي ${n} محاولات مجانية`,wamsg:'مرحبا، محتاج مساعدة. حسابي: ',wait:'بنجهز أقوى قائمة... (ممكن ياخد نص دقيقة)',nomore:'خلصت المحاولات المجانية، اشترك للمتابعة',amount:'المبلغ:',egp:' (بالجنيه حسب سعر الدولار اليوم)',email:'إيميل حسابك:',after:'بعد التحويل ابعت صورة الإيصال على واتساب وهنفعّل اشتراكك.',paid:'دفعت اشتراك',myemail:'إيميل حسابي:',btn:'English'},
en:{brand:'Listing Optimizer',logout:'Sign out',h1:'Turn your products into <span>professional listings</span>',loginp:'Sign in to start (3 free tries for new users)',google:'Sign in with Google',name:'Product name',details:'Product details',go:'Generate listing',sub:'Subscription',monthly:'Monthly',yearly:'Yearly',subscribe:'Subscribe',paymethod:'Choose a payment method',sendreceipt:'Send payment receipt on WhatsApp',support:'WhatsApp 💬 Support',privacy:'Privacy Policy',terms:'Terms',active:(p,d)=>`Your ${p} plan: ${d} days left`,left:n=>`${n} free tries left`,wamsg:'Hi, I need help. My account: ',wait:'Preparing your listing... (may take up to 30 seconds)',nomore:'Free tries are used up. Subscribe to continue.',amount:'Amount:',egp:' (in EGP at today\'s dollar rate)',email:'Your account email:',after:'After paying, send the receipt photo on WhatsApp and we will activate your plan.',paid:'I paid for a',myemail:'My account email:',btn:'العربية'}};
let LANG=localStorage.lang||'ar';
function t(k,...a){const v=D[LANG][k];return typeof v==='function'?v(...a):v}
function setLang(l){LANG=l;localStorage.lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=D[l][e.dataset.i]);
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=D[l][e.dataset.p]);
 $('lang_btn').textContent=D[l].btn;if(sb&&ME){refresh()}if(PLAN)show()}

async function api(p,o={}){const {data}=await sb.auth.getSession();
 return fetch(p,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+(data.session?.access_token||'')}})}
function login(provider){sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin}})}
async function refresh(){
 const {data}=await sb.auth.getSession();const on=!!data.session;
 $('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);$('out_btn').classList.toggle('hide',!on);
 if(!on){$('status').classList.add('hide');return}
 const r=await api('/api/me');if(!r.ok)return;ME=await r.json();
 $('status').classList.remove('hide');
 $('status').textContent=ME.active?t('active',ME.plan==='yearly'?t('yearly'):t('monthly'),ME.daysLeft):t('left',ME.left);
 wa();}
function wa(){$('wafab').href='https://wa.me/'+C.whatsapp+'?text='+encodeURIComponent(t('wamsg')+(ME?ME.email:''))}
(async()=>{C=await (await fetch('/api/config')).json();
 sb=supabase.createClient(C.supabaseUrl,C.supabaseAnon);wa();setLang(LANG);
 sb.auth.onAuthStateChange(refresh);refresh()})();
$('go').onclick=async()=>{let image;const f=$('img').files[0];
 if(f){const d=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});image={mime:f.type,data:d}}
 $('out').textContent=t('wait');
 const r=await api('/api/generate',{method:'POST',body:JSON.stringify({name:$('name').value,details:$('details').value,lang:LANG,image})});
 const j=await r.json();$('out').textContent=r.status===402?t('nomore'):JSON.stringify(j.result??j,null,2);refresh()};
function pick(p){PLAN=p;$('pay').classList.remove('hide');show()}
function show(){const m=$('method').value,price=C.plans[PLAN];
 const d={paypal:'PayPal: '+C.paypal,binance:'Binance Pay ID: '+C.binance,orange:'Orange Cash: '+C.orange}[m];
 $('inst').textContent=t('amount')+` $${price}${m==='orange'?t('egp'):''}\n${d}\n${t('email')} ${ME.email}\n${t('after')}`;
 $('wa').href='https://wa.me/'+C.whatsapp+'?text='+encodeURIComponent(`${t('paid')} ${PLAN==='yearly'?t('yearly'):t('monthly')} ($${price}) / ${m}. ${t('myemail')} ${ME.email}`)}
</script></main></body></html>
