<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>محسّن قوائم المنتجات</title>
<meta name="color-scheme" content="light dark">
<script>document.documentElement.dataset.theme=localStorage.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--muted:#475569;--card:#fff;--border:#e2e8f0;--field:#cbd5e1;--soft:#ccfbf1;--soft-fg:#115e59;--cp-bg:#f0fdfa;--cp-border:#99f6e4;--cp-fg:#0f766e;--shadow:0 1px 3px rgba(15,23,42,.06);--lift:0 8px 20px rgba(15,23,42,.10)}
[data-theme=dark]{--bg:#0b1220;--fg:#e2e8f0;--muted:#94a3b8;--card:#121d31;--border:#1f2b3f;--field:#33455e;--soft:#0f3d3a;--soft-fg:#5eead4;--cp-bg:#0f2c28;--cp-border:#115e59;--cp-fg:#5eead4;--shadow:0 1px 3px rgba(0,0,0,.45);--lift:0 8px 24px rgba(0,0,0,.5)}
*{transition:background-color .25s,border-color .25s,color .25s,box-shadow .25s}
body{padding-bottom:84px;font-family:system-ui,sans-serif;background:var(--bg);margin:0;color:var(--fg)}
main{max-width:640px;margin:auto;padding:24px}
h1 span{color:#0d9488}input,textarea,button,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--field);font:inherit;box-sizing:border-box;background:var(--card);color:var(--fg)}
input:focus,textarea:focus,select:focus{outline:none;border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
button{background:linear-gradient(90deg,#14b8a6,#0e7490);color:#fff;border:0;cursor:pointer}
button:hover{filter:brightness(1.08)}button:active{transform:translateY(1px)}
pre{white-space:pre-wrap;background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--border)}
.plans{display:flex;gap:8px}.plans div{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.lnk{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid var(--field);background:var(--card);color:var(--fg);text-decoration:none;white-space:nowrap}.lnk:hover{border-color:#14b8a6;box-shadow:var(--lift)}.lnk.hide{display:none}.bar button{width:auto}#lang_btn,#theme_btn{margin:0}
.badge{background:var(--soft);color:var(--soft-fg);border-radius:20px;padding:6px 12px}
.hide{display:none}.g{background:var(--card);color:var(--fg);border:1px solid var(--field)}.f{background:#1877f2}
#out{margin-top:12px}.msg{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,background-color .25s,border-color .25s}
.card:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;color:#0f766e}
[data-theme=dark] .card h3{color:#2dd4bf}
.card h3 .cp{margin-inline-start:auto}
.cp{width:auto;margin:0;padding:6px 12px;font-size:13px;background:var(--cp-bg);color:var(--cp-fg);border:1px solid var(--cp-border);border-radius:8px}
.cp.ok{background:#0d9488;color:#fff}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;margin:8px 0;line-height:1.7}
.item .n{flex:none;width:24px;height:24px;border-radius:50%;background:#14b8a6;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.item .tx{flex:1;word-break:break-word}.item .cp{flex:none}
.desc{line-height:1.9;white-space:pre-wrap;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--soft);color:var(--soft-fg);border-radius:20px;padding:6px 14px;font-size:14px}
.card ul{margin:0;padding-inline-start:22px;line-height:1.9}
.allbtn{margin:4px 0}
.upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.upload-btn{width:auto;min-width:150px;margin:0;padding:11px 16px;font-weight:600}
#img{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#img:focus-visible+.upload-btn{outline:3px solid var(--cp-border);outline-offset:2px}
#img-name{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
a{color:#0d9488}
@media(max-width:480px){main{padding:14px}.item{flex-wrap:wrap}}
</style></head><body><main>
<div class="bar"><b data-i="brand">محسّن القوائم</b><button id="theme_btn" class="g" aria-label="dark mode">🌙</button><button id="lang_btn" class="g" onclick="setLang(LANG==='ar'?'en':'ar')">English</button><a id="hist_btn" class="lnk hide" href="/history.html" data-i="history">بحوثي السابقة</a><span id="status" class="badge hide"></span><button id="out_btn" class="hide g" onclick="sb.auth.signOut()" data-i="logout">خروج</button></div>
<h1 data-i="h1">حوّل منتجاتك إلى <span>قوائم احترافية</span></h1>

<section id="login" class="hide"><p data-i="loginp">سجّل دخول عشان تبدأ (3 محاولات مجانية للمستخدم الجديد)</p>
<button class="g" onclick="login('google')" data-i="google">الدخول بحساب Google</button><!-- Facebook: enable after Meta review --><button class="f hide" onclick="login('facebook')">الدخول بحساب Facebook</button></section>

<section id="app" class="hide">
<input id="name" data-p="name" placeholder="اسم المنتج"><textarea id="details" rows="4" data-p="details" placeholder="تفاصيل المنتج"></textarea>
<div class="upload"><input id="img" type="file" accept="image/*"><label for="img" class="upload-btn" id="img-label" data-i="upload">اختر صورة</label><span id="img-name" aria-live="polite" data-i="no_file">لم يتم اختيار ملف</span></div><button id="go" data-i="go">ولّد القائمة</button>
<label for="outlang" data-i="outlang" style="font-size:14px">لغة المحتوى اللي هيتولّد</label><select id="outlang"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="de">Deutsch</option><option value="tr">Türkçe</option><option value="it">Italiano</option><option value="pt">Português</option></select><div id="out"></div>
<h2 data-i="sub">الاشتراك</h2>
<div class="plans"><div><b data-i="monthly">شهري</b><br>$25<button onclick="pick('monthly')" data-i="subscribe">اشترك</button></div><div><b data-i="yearly">سنوي</b><br>$228<button onclick="pick('yearly')" data-i="subscribe">اشترك</button></div></div>
<div id="pay" class="hide"><h3 data-i="paymethod">اختر طريقة الدفع</h3>
<select id="method" onchange="show()"><option value="paypal">PayPal</option><option value="binance">Binance Pay</option><option value="orange">Orange Cash</option></select>
<pre id="inst"></pre><a id="wa" target="_blank"><button data-i="sendreceipt">ابعت إيصال الدفع على واتساب</button></a></div>
</section>
<a id="wafab" target="_blank" style="position:fixed;bottom:16px;left:16px;background:#25d366;color:#fff;padding:12px 18px;border-radius:30px;text-decoration:none"data-i="support">واتساب 💬 الدعم</a>
<p id="visit-count" style="text-align:center;font-size:13px;color:#64748b" data-i="visits">عدد المسجلين: جارٍ التحميل...</p>
<p style="text-align:center;font-size:13px"><a href="/privacy.html" data-i="privacy">سياسة الخصوصية</a> · <a href="/terms.html" data-i="terms">الشروط</a></p>
<script>
const $=id=>document.getElementById(id);let sb,C={},ME=null,PLAN='';
document.addEventListener('change',e=>{if(e.target.id==='outlang')localStorage.outlang=e.target.value});
const D={ar:{brand:'محسّن القوائم',logout:'خروج',h1:'حوّل منتجاتك إلى <span>قوائم احترافية</span>',loginp:'سجّل دخول عشان تبدأ (3 محاولات مجانية للمستخدم الجديد)',google:'الدخول بحساب Google',name:'اسم المنتج',details:'تفاصيل المنتج',go:'ولّد القائمة',outlang:'لغة المحتوى اللي هيتولّد',sub:'الاشتراك',monthly:'شهري',yearly:'سنوي',subscribe:'اشترك',paymethod:'اختر طريقة الدفع',sendreceipt:'ابعت إيصال الدفع على واتساب',support:'واتساب 💬 الدعم',privacy:'سياسة الخصوصية',terms:'الشروط',active:(p,d)=>`اشتراكك ${p}: باقي ${d} يوم`,left:n=>`متبقي ${n} محاولات مجانية`,wamsg:'مرحبا، محتاج مساعدة. حسابي: ',wait:'بنجهز أقوى قائمة... (ممكن ياخد نص دقيقة)',nomore:'خلصت المحاولات المجانية، اشترك للمتابعة',amount:'المبلغ:',egp:' (بالجنيه حسب سعر الدولار اليوم)',email:'إيميل حسابك:',after:'بعد التحويل ابعت صورة الإيصال على واتساب وهنفعّل اشتراكك.',paid:'دفعت اشتراك',myemail:'إيميل حسابي:',btn:'English',history:'بحوثي السابقة',r_titles:'العناوين',r_desc:'الوصف',r_bullets:'نقاط البيع',r_keywords:'الكلمات المفتاحية',r_ads:'نصوص الإعلانات',copy:'نسخ',copied:'تم ✓',copyall:'نسخ القائمة كاملة',errgen:'حصل خطأ مؤقت، جرّب تاني بعد لحظات (محاولتك ماتخصمتش)',upload:'اختر صورة',no_file:'لم يتم اختيار ملف',visits:'عدد المسجلين: جارٍ التحميل...'},
en:{brand:'Listing Optimizer',logout:'Sign out',h1:'Turn your products into <span>professional listings</span>',loginp:'Sign in to start (3 free tries for new users)',google:'Sign in with Google',name:'Product name',details:'Product details',go:'Generate listing',outlang:'Generated content language',sub:'Subscription',monthly:'Monthly',yearly:'Yearly',subscribe:'Subscribe',paymethod:'Choose a payment method',sendreceipt:'Send payment receipt on WhatsApp',support:'WhatsApp 💬 Support',privacy:'Privacy Policy',terms:'Terms',active:(p,d)=>`Your ${p} plan: ${d} days left`,left:n=>`${n} free tries left`,wamsg:'Hi, I need help. My account: ',wait:'Preparing your listing... (may take up to 30 seconds)',nomore:'Free tries are used up. Subscribe to continue.',amount:'Amount:',egp:' (in EGP at today\'s dollar rate)',email:'Your account email:',after:'After paying, send the receipt photo on WhatsApp and we will activate your plan.',paid:'I paid for a',myemail:'My account email:',btn:'العربية',history:'My history',r_titles:'Titles',r_desc:'Description',r_bullets:'Key selling points',r_keywords:'Keywords',r_ads:'Ad copy',copy:'Copy',copied:'Copied ✓',copyall:'Copy full listing',errgen:'Temporary error, please try again in a moment (your try was not used)',upload:'Choose image',no_file:'No file selected',visits:'Registered users: loading...'}};
let LANG=localStorage.lang||'ar';
function t(k,...a){const v=D[LANG][k];return typeof v==='function'?v(...a):v}
$('img').addEventListener('change',()=>{$('img-name').textContent=$('img').files[0]?.name||t('no_file')});
let visitTotal=null;function showVisits(){if(visitTotal!==null)$('visit-count').textContent=(LANG==='ar'?'عدد المسجلين: ':'Registered users: ')+visitTotal}
function loadVisits(bust){fetch('/api/registration-count',bust?{cache:'reload'}:{}).then(r=>r.ok?r.json():null).then(d=>{if(d&&Number.isFinite(Number(d.count))){visitTotal=Number(d.count);showVisits()}else throw 0}).catch(()=>{$('visit-count').textContent=LANG==='ar'?'تعذّر تحميل عدد المسجلين':'Registered count unavailable'})}
loadVisits();
function setTheme(m){document.documentElement.dataset.theme=m;localStorage.theme=m;$('theme_btn').textContent=m==='dark'?'☀️':'🌙'}
$('theme_btn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');
function setLang(l){LANG=l;localStorage.lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=D[l][e.dataset.i]);
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=D[l][e.dataset.p]);
 if($('img').files[0])$('img-name').textContent=$('img').files[0].name;
 showVisits();
 $('lang_btn').textContent=D[l].btn;$('outlang').value=localStorage.outlang||l;if(sb&&ME){refresh()}if(PLAN)show()}

async function api(p,o={}){const {data}=await sb.auth.getSession();
 return fetch(p,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+(data.session?.access_token||'')}})}
function login(provider){sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin}})}
async function refresh(){
 const {data}=await sb.auth.getSession();const on=!!data.session;
 $('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);$('out_btn').classList.toggle('hide',!on);$('hist_btn').classList.toggle('hide',!on);
 if(!on){$('status').classList.add('hide');return}
 const r=await api('/api/me');if(!r.ok)return;ME=await r.json();
 loadVisits(1);
 $('status').classList.remove('hide');
 $('status').textContent=ME.active?t('active',ME.plan==='yearly'?t('yearly'):t('monthly'),ME.daysLeft):t('left',ME.left);
 wa();}
function wa(){$('wafab').href='https://wa.me/'+C.whatsapp+'?text='+encodeURIComponent(t('wamsg')+(ME?ME.email:''))}
(async()=>{C=await (await fetch('/api/config')).json();
 sb=supabase.createClient(C.supabaseUrl,C.supabaseAnon);wa();setLang(LANG);
 sb.auth.onAuthStateChange(refresh);refresh()})();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v.map(x=>typeof x==='string'?x:(x&&(x.text||x.title||x.value))||JSON.stringify(x)).filter(Boolean):(v?String(v).split(/\n+/).map(s=>s.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,'').trim()).filter(Boolean):[]);
let CP=[];
function cpBtn(txt){CP.push(txt);return `<button class="cp" data-c="${CP.length-1}">${t('copy')}</button>`}
function renderResult(res,oLang){
 CP=[];let o=res;
 if(typeof o==='string'){try{o=JSON.parse(o)}catch(e){o={raw:o}}}
 if(!o||typeof o!=='object')o={raw:String(o??'')};
 const pick=(...k)=>{for(const x of k)if(o[x]!=null&&o[x]!=='')return o[x]};
 const titles=arr(pick('titles','title')),desc=pick('description','desc'),bul=arr(pick('bullets','bullet_points')),kw=arr(pick('keywords')),ads=arr(pick('ads','ad_copy'));
 const dir=oLang==='ar'?'rtl':'ltr';
 if(!titles.length&&!desc&&!bul.length&&!kw.length&&!ads.length){
  const raw=String(o.raw||'').replace(/^```(?:json)?|```$/g,'').trim();
  return `<div class="card" dir="${dir}"><div class="desc">${esc(raw||t('errgen'))}</div></div>`}
 const d=typeof desc==='string'?desc:arr(desc).join('\n');
 let h=`<div dir="${dir}">`;
 const all=[];
 if(titles.length){all.push(titles.join('\n'));h+=`<div class="card"><h3>🏷️ ${t('r_titles')}</h3>${titles.map((x,i)=>`<div class="item"><span class="n">${i+1}</span><span class="tx">${esc(x)}</span>${cpBtn(x)}</div>`).join('')}</div>`}
 if(d){all.push(d);h+=`<div class="card"><h3>📝 ${t('r_desc')}${cpBtn(d)}</h3><div class="desc">${esc(d)}</div></div>`}
 if(bul.length){all.push(bul.map(x=>'• '+x).join('\n'));h+=`<div class="card"><h3>✅ ${t('r_bullets')}${cpBtn(bul.map(x=>'• '+x).join('\n'))}</h3><ul>${bul.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
 if(kw.length){all.push(kw.join(', '));h+=`<div class="card"><h3>🔎 ${t('r_keywords')}${cpBtn(kw.join(', '))}</h3><div class="chips">${kw.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`}
 if(ads.length){all.push(ads.join('\n\n'));h+=`<div class="card"><h3>📣 ${t('r_ads')}</h3>${ads.map((x,i)=>`<div class="item"><span class="n">${i+1}</span><span class="tx">${esc(x)}</span>${cpBtn(x)}</div>`).join('')}</div>`}
 CP.push(all.join('\n\n'));
 return h+`<button class="allbtn cp" style="width:100%;padding:12px;font-size:15px" data-c="${CP.length-1}">${t('copyall')}</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('.cp');if(!b||b.dataset.c==null)return;
 navigator.clipboard.writeText(CP[b.dataset.c]).then(()=>{const o=b.textContent;b.textContent=t('copied');b.classList.add('ok');setTimeout(()=>{b.textContent=o;b.classList.remove('ok')},1500)})});
$('go').onclick=async()=>{if($('go').disabled)return;$('go').disabled=true;try{let image;const f=$('img').files[0];
 if(f){image=await new Promise(res=>{const x=new FileReader();x.onload=()=>{const raw=x.result;const im=new Image();
  im.onload=()=>{try{const k=Math.min(1,1024/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.85).split(',')[1]})}catch(e){res({mime:f.type,data:raw.split(',')[1]})}};
  im.onerror=()=>res({mime:f.type,data:raw.split(',')[1]});im.src=raw};x.readAsDataURL(f)})}
 $('out').innerHTML=`<div class="msg">${esc(t('wait'))}</div>`;
 const oL=$('outlang').value;
 let r,j;try{r=await api('/api/generate',{method:'POST',body:JSON.stringify({name:$('name').value,details:$('details').value,lang:LANG,outLang:oL,image})});j=await r.json()}catch(e){j={error:'network'}}
 if(r&&r.status===402)$('out').innerHTML=`<div class="msg">${esc(t('nomore'))}</div>`;
 else if(!r||!r.ok||j.result==null)$('out').innerHTML=`<div class="msg">${esc(t('errgen'))}</div>`;
 else $('out').innerHTML=renderResult(j.result,oL);
 refresh()}finally{$('go').disabled=false}};
function pick(p){PLAN=p;$('pay').classList.remove('hide');show()}
function show(){const m=$('method').value,price=C.plans[PLAN];
 const d={paypal:'PayPal: '+C.paypal,binance:'Binance Pay ID: '+C.binance,orange:'Orange Cash: '+C.orange}[m];
 $('inst').textContent=t('amount')+` $${price}${m==='orange'?t('egp'):''}\n${d}\n${t('email')} ${ME.email}\n${t('after')}`;
 $('wa').href='https://wa.me/'+C.whatsapp+'?text='+encodeURIComponent(`${t('paid')} ${PLAN==='yearly'?t('yearly'):t('monthly')} ($${price}) / ${m}. ${t('myemail')} ${ME.email}`)}
</script></main></body></html>
