name: Keep Render service warm
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 60 https://listing-ai-81we.onrender.com/healthz)
          echo "HTTP $status"
          test "$status" = "200"
